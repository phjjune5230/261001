# Netlify 설정 — 과거 대화 뷰어
#
# ★ Netlify 대시보드에서 Base directory를 "viewer"로 잡아야 이 파일이 쓰입니다 ★
#   (base를 viewer로 두면 아래 publish="."은 그 안을 뜻합니다)
#
# 이 앱의 나머지(first_app 본체)는 Vercel에서 돌아갑니다. 이 파일은
# Netlify 전용이라 Vercel은 이 파일을 읽지 않습니다. 같은 저장소를
# 두 곳에 붙이는 구성입니다.

[build]
  # 빌드가 없습니다 — package.json이 없는 순수 정적 폴더라 Netlify가
  # 아무것도 실행하지 않고 그대로 올립니다.
  publish = "."

# 헤더. Supabase REST는 CORS를 처리하므로 따로 설정할 게 없습니다.
# 이건 뷰어 정적 파일에만 걸립니다.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"